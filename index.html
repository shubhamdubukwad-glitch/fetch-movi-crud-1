    <div class="moviModal" id="moviModal">
        <form id="moviForm">
            <div class="card">
                <div class="card-header d-flex justify-content-between">
                    <h3 class="m-0">Movie Name</h3>
                    <i role="button" class="fa-solid fa-xmark fa-2x closeForm"></i>
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label for="movieName">Movie Name :</label>
                        <input type="text" class="form-control" id="movieName">
                    </div>
                    <div class="form-group">
                        <label for="movieImg">Movie Image :</label>
                        <input type="text" class="form-control" id="movieImg">
                    </div>
                    <div class="form-group">
                        <label for="movieDescription">Movie Description :</label>
                        <textarea type="text" class="form-control" id="movieDescription"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="movieRating">Movie Rating :</label>
                        <select type="text" id="movieRating" class="form-control">
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>
                            <option value="9">9</option>
                            <option value="10">10</option>
                        </select>
                    </div>
                </div>
                <div class="card-footer d-flex justify-content-between">
                    <button type="submit" id="AddMovieCard" class="btn btn-sm net-sec-btn">Add Movie</button>
                    <button type="button" id="UpdateMovieCard" class="btn btn-sm net-sec-btn d-none">Update
                        Movie</button>
                    <button type="button" id="closeForm" class="btn btn-sm net-pri-btn closeForm">close</button>
                </div>
            </div>
        </form>
    </div>
    <div class="backDrop closeForm" id="backDrop"></div>


    <div class="spinner d-none" id="spinner">
        <div class="spinner-border text-primary" role="status">
            <span class="sr-only">Loading...</span>
        </div>
